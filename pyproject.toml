[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-planner"
version = "0.1.0"
description = "RouteDiffuser: portfolio-grade autonomous driving diffusion planner with a conditional 1D U-Net policy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["planner*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
